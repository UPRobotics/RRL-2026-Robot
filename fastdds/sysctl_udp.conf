# UDP socket buffer tuning for ROS 2 / DDS over WiFi
# ─────────────────────────────────────────────────────
# Larger buffers reduce packet drops under burst traffic and eliminate
# retransmit delays on RELIABLE topics (e.g. config updates).
#
# Apply immediately (both robot and ground station):
#   sudo sysctl -p /path/to/fastdds/sysctl_udp.conf
#
# Apply permanently (survives reboot):
#   sudo cp fastdds/sysctl_udp.conf /etc/sysctl.d/99-ros2-udp.conf
#   sudo sysctl --system

net.core.rmem_max     = 26214400
net.core.wmem_max     = 26214400
net.core.rmem_default = 26214400
net.core.wmem_default = 26214400
